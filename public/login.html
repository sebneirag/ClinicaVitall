<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Clínica Vital SpA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card-login { width: 100%; max-width: 400px; padding: 25px; border-radius: 12px; border: 1px solid #333; background-color: #1e1e1e; }
  </style>
</head>
<body>

  <div class="card-login text-center shadow-lg">
    <h3 class="fw-bold mb-1 text-light">Clínica Vital SpA</h3>
    <p class="text-secondary small mb-4">Gestión de Inventarios y Fichas Médicas QR</p>

    <div id="alert-error" class="alert alert-danger d-none" role="alert">
      Usuario o contraseña incorrectos.
    </div>

    <form id="login-form">
      <div class="form-floating mb-3 text-start">
        <input type="text" class="form-control bg-dark text-light border-secondary" id="username" placeholder="Usuario" required>
        <label for="username" class="text-secondary">Usuario</label>
      </div>

      <div class="form-floating mb-4 text-start">
        <input type="password" class="form-control bg-dark text-light border-secondary" id="password" placeholder="Contraseña" required>
        <label for="password" class="text-secondary">Contraseña</label>
      </div>

      <button type="submit" class="btn btn-light w-100 py-2 fw-bold">Iniciar Sesión</button>
    </form>
    
    <div class="mt-4 text-muted small">
      Credenciales demo: <code>admin</code> / <code>admin123</code>
    </div>
  </div>

  <script>
    sessionStorage.clear();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usernameInput = document.getElementById('username').value;
      const passwordInput = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('authenticated', 'true');
          window.location.href = 'index.html';
        } else {
          document.getElementById('alert-error').classList.remove('d-none');
        }
      } catch (error) {
        console.error('Error al iniciar sesión:', error);
      }
    });
  </script>
</body>
</html>
