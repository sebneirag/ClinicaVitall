<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; display: flex; align-items: center; justify-content: center; height: 100vh; color: #000; }
        .card-login { width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; background: #ffffff; border: 2px solid #333; box-shadow: 0 8px 24px rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="card card-login">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark mb-1">Clínica Vital</h2>
            <p class="text-muted small fw-bold">Acceso Exclusivo para Personal Autorizado</p>
        </div>
        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label fw-bold text-dark">Usuario Admin</label>
                <input type="text" id="usuario" class="form-control border-dark" value="admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold text-dark">Contraseña</label>
                <input type="password" id="password" class="form-control border-dark" value="admin123" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold text-uppercase">Ingresar al Sistema</button>
        </form>
    </div>

    <script>
        sessionStorage.clear();

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    usuario: document.getElementById('usuario').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (data.success) {
                sessionStorage.setItem('session', 'active');
                window.location.href = 'index.html';
            } else {
                alert(data.mensaje);
            }
        });
    </script>
</body>
</html>
